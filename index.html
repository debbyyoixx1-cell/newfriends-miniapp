<!doctype html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102321">
<title>New Friends For You — အမည်မသိ စကားပြောခန်း</title>
<meta name="description" content="Telegram Mini App မှာ အမည်မသိ မိတ်ဆွေသစ်တွေနဲ့ စကားပြောပါ။">
<meta property="og:title" content="New Friends For You — အမည်မသိ စကားပြောခန်း">
<meta property="og:description" content="အမည်မသိ မိတ်ဆွေသစ်တွေနဲ့ စကားပြောပါ။">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand-mark" aria-hidden="true">✳</div>
    <div class="brand"><strong>New Friends<br>For You</strong><span>ANONYMOUS SPACE</span></div>
    <div class="privacy" title="အမည်မဖော်ပြပါ">◈</div>
  </header>
  <main class="main">
    <div class="section-label"><span>01 / CHAT ROOM</span><span class="live-dot">● LIVE</span></div>
    <h1>အမည်မသိ<br><em>စကားပြောခန်း။</em></h1>
    <div class="status-line"><span id="status-dot" class="status-dot"></span><span id="status">Telegram တွင် ဖွင့်ပါ</span></div>
    <section id="conversation" class="conversation" aria-label="စကားပြောခန်း">
      <div id="messages" class="messages" aria-live="polite">
        <div class="empty-state" id="empty-state"><div class="chat-symbol">✳</div><p>မိတ်ဆွေသစ်တစ်ယောက်နဲ့<br>စကားစမြည်ပြောကြည့်ပါ။</p></div>
      </div>
    </section>
    <div id="notice" class="notice" role="status"></div>
  </main>
  <footer class="composer-wrap">
    <div id="actions" class="actions"><button id="join" class="primary-action" type="button" disabled>စကားပြောဖော် ရှာမယ် <span>↗</span></button></div>
    <form id="composer" class="composer" hidden><input id="message" type="text" maxlength="2000" autocomplete="off" placeholder="စာရေးပါ..." aria-label="စာရေးပါ" required><button id="send" type="submit" title="ပို့မယ်" aria-label="ပို့မယ်">↗</button></form>
    <div id="room-actions" class="room-actions" hidden><button id="next" type="button">↻ နောက်တစ်ယောက်</button><button id="leave" type="button">× ထွက်မယ်</button></div>
    <p class="foot-note">NAMES STAY PRIVATE · CONVERSATIONS STAY HERE</p>
  </footer>
</div>
<script src="./app.js?v=3" defer></script>
</body>
</html>
